; php-fpm process pool: receives requests from NGINX over the network (port 9000), not via a unix socket,
; because NGINX lives in a different container.
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; PHP errors go to the container logs (docker logs wordpress)
catch_workers_output = yes
